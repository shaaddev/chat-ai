name: claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets, so only review branches pushed to this repo.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_CLAUDE_CREDENTIALS: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: explain skip
        if: env.HAS_CLAUDE_CREDENTIALS != 'true'
        run: echo "::notice::Claude review skipped. Add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN to the repository secrets to enable it."

      - name: checkout
        if: env.HAS_CLAUDE_CREDENTIALS == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: review
        if: env.HAS_CLAUDE_CREDENTIALS == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The app is a Next.js App Router chat client on
            Postgres (Neon, Drizzle), Better Auth, the Vercel AI SDK, and UploadThing.
            Biome and TypeScript already run in CI, so skip formatting and type nits.

            Report only issues a maintainer would fix before merging:
            - Correctness bugs, broken edge cases, and race conditions.
            - Authorization gaps: every chat, message, and file route must check that
              the signed-in user owns the row it reads or writes.
            - Data integrity: migrations, idempotency, transactions, and lost writes.
            - Performance regressions: N+1 queries, unbounded reads, needless client
              re-renders, and large client bundles.
            - Accessibility regressions in UI changes.

            Put each finding in an inline comment on the line it concerns, with a
            concrete failure scenario. Then post one short summary comment. If you
            find nothing worth fixing, say so in one sentence.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
